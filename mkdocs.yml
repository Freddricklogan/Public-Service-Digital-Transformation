site_name: Public Service Digital Transformation
site_description: Service design, change management, a digital maturity model, an implementation roadmap and a stakeholder readiness template for public sector organizations, with a maturity gap analysis and a readiness scorer.
site_url: https://freddricklogan.github.io/Public-Service-Digital-Transformation/
copyright: Freddrick Logan
strict: true
theme:
  name: material
  features: [navigation.sections, navigation.top, search.highlight, content.code.copy]
  palette:
    - scheme: slate
      primary: blue grey
      accent: cyan
nav:
  - Overview: index.md
  - Framework:
      - Service design methodology: service-design-methodology.md
      - Change management strategy: change-management-strategy.md
      - Digital maturity model: digital-maturity-model.md
      - Implementation roadmap: implementation-roadmap.md
      - Stakeholder readiness template: stakeholder-assessment.md
  - Tools:
      - Maturity gap analysis: tools/maturity.md
      - Readiness score: tools/readiness.md
  - Case study: CASE_STUDY.md
extra_css:
  - assets/shell/exec-shell.css
  - assets/shell/tool.css
extra_javascript:
  - path: assets/site.js
    type: module
  - path: assets/maturity-page.js
    type: module
  - path: assets/readiness-page.js
    type: module
markdown_extensions:
  - toc:
      permalink: true
  - admonition
